# Pythagoras local development stack: data services.
# Application services (gateway, web, api, worker, cms, identity) are added in
# later milestones. Images are pinned by version and digest.
#
#   scripts/dev-secrets.sh          # once: generate local secrets
#   docker compose up -d            # start PostgreSQL and Redis
#   scripts/db-migrate.sh up        # apply migrations
#   scripts/db-test.sh              # run database and Redis tests

name: pythagoras

x-workspace-volumes: &workspace-volumes
  - .:/workspace
  - ws_node_modules:/workspace/node_modules
  - ws_api_node_modules:/workspace/apps/api/node_modules
  - ws_api_dist:/workspace/apps/api/dist
  - ws_web_node_modules:/workspace/apps/web/node_modules
  - ws_web_next:/workspace/apps/web/.next
  - ws_shared_node_modules:/workspace/packages/shared/node_modules
  - ws_shared_dist:/workspace/packages/shared/dist

x-workspace-env: &workspace-env
  npm_config_store_dir: /workspace/node_modules/.pnpm-store
  # File events do not cross from Windows into containers; poll instead.
  CHOKIDAR_USEPOLLING: "true"
  WATCHPACK_POLLING: "true"
  TSC_WATCHFILE: PriorityPollingInterval
  TSC_WATCHDIRECTORY: DynamicPriorityPolling

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "5"

services:
  postgres:
    <<: *hardening
    image: postgres:18.6-trixie@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --data-checksums --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8 --locale=C.UTF-8 --auth-local=peer --auth-host=scram-sha-256
      TZ: UTC
    secrets:
      - pg_superuser_password
      - pg_migrator_password
      - pg_api_password
      - pg_worker_password
      - pg_reporting_password
      - pg_backup_password
      - pg_keycloak_password
    volumes:
      - pg_data:/var/lib/postgresql
      - pg_backups:/backups:ro
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./db:/opt/pythagoras/db:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    shm_size: 256mb
    stop_grace_period: 60s
    healthcheck:
      # Healthy only on the real server (the init-time server has no TCP listener)
      # and only once the application database exists.
      test: ["CMD-SHELL", "gosu postgres psql -XtAq -d pythagoras -c \"SELECT 1 WHERE current_setting('listen_addresses') <> ''\" | grep -q 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s

  redis:
    <<: *hardening
    image: redis:8.10.2-trixie@sha256:97ec88159e6d7cfb5ddef9015386087d58a912de80112f06ebdfa78fa5989901
    entrypoint: ["/bin/sh", "/opt/pythagoras/redis-entrypoint.sh"]
    secrets:
      - redis_queue_password
      - redis_health_password
      - redis_admin_password
    volumes:
      - redis_data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./infra/redis/entrypoint.sh:/opt/pythagoras/redis-entrypoint.sh:ro
    tmpfs:
      - /run/redis-acl:size=1m
      # Hide the bundled modules (search, JSON, time series): the queue needs none of them.
      - /usr/local/lib/redis/modules:size=1m
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-56379}:6379"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_health_password)\" redis-cli --no-auth-warning --user pyth_health ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Identity provider (ADR 0009). Development mode imports the development realm
  # with synthetic users on first start; production uses `start --optimized`
  # behind the gateway with a user-free realm (see docs/operations.md).
  keycloak:
    <<: *hardening
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    entrypoint: ["/bin/bash", "/opt/pythagoras/keycloak-entrypoint.sh"]
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: pyth_keycloak
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HOST_PORT:-58080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_CACHE: local
      KC_LOG_LEVEL: info
      # Social login brokers the platform does not use.
      KC_FEATURES_DISABLED: twitter-broker
    secrets:
      - pg_keycloak_password
      - keycloak_admin_password
      - keycloak_web_client_secret
      - keycloak_dev_user_password
    volumes:
      - ./infra/keycloak/entrypoint.sh:/opt/pythagoras/keycloak-entrypoint.sh:ro
      - ./infra/keycloak/realm:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-58080}:8080"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # One-off migration job (also used by releases). Run through scripts/db-migrate.sh.
  db-migrate:
    image: ghcr.io/amacneil/dbmate:2.34.1@sha256:3298bdfcb651af608e06d2e13ae12398c4056e5326d38ef31885973d83248d9c
    profiles: ["tools"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - pg_migrator_password
    environment:
      DB_NAME: ${DB_NAME:-pythagoras}
    volumes:
      - ./db/migrations:/db/migrations:ro
    entrypoint:
      - /bin/sh
      - -c
      - >-
        export DATABASE_URL="postgres://pyth_migrator:$$(cat /run/secrets/pg_migrator_password)@postgres:5432/$${DB_NAME}?sslmode=disable";
        exec dbmate --migrations-dir /db/migrations --migrations-table meta.schema_migrations --no-dump-schema --wait --wait-timeout 60s "$$@"
      - dbmate
    command: ["up"]

  # Development toolchain (ADR 0012). Run through scripts/pnpm.sh and scripts/check.sh.
  workspace:
    build:
      context: ./infra/dev
    image: pythagoras-dev:node24-pnpm12
    profiles: ["tools"]
    security_opt:
      - no-new-privileges:true
    environment: *workspace-env
    volumes: *workspace-volumes

  # Installs dependencies from the lockfile and builds the shared package, once,
  # before the application services start.
  deps:
    build:
      context: ./infra/dev
    image: pythagoras-dev:node24-pnpm12
    security_opt:
      - no-new-privileges:true
    environment: *workspace-env
    volumes: *workspace-volumes
    command: ["sh", "-c", "pnpm install --frozen-lockfile --reporter=silent && pnpm --filter @pythagoras/shared build"]

  # Business API in watch mode (ADR 0013). Production uses a built image (M1.6).
  api:
    <<: *hardening
    image: pythagoras-dev:node24-pnpm12
    command: ["pnpm", "--filter", "@pythagoras/api", "start:dev"]
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      <<: *workspace-env
      NODE_ENV: development
      DB_PASSWORD_FILE: /run/secrets/pg_api_password
      # No Stripe keys in development: the development payment provider (ADR 0010).
      PAYMENT_PROVIDER: development
      DEV_PAYMENTS_SECRET_FILE: /run/secrets/dev_payments_secret
    secrets:
      - pg_api_password
      - dev_payments_secret
    volumes: *workspace-volumes
    ports:
      - "127.0.0.1:${API_HOST_PORT:-53001}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Background worker: outbox relay, event handlers, scheduled maintenance. Same
  # package as the API; in development it runs the API service's compiled output
  # and restarts when it changes, so the code is compiled once.
  worker:
    <<: *hardening
    image: pythagoras-dev:node24-pnpm12
    command: ["pnpm", "--filter", "@pythagoras/api", "start:worker:dev"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *workspace-env
      NODE_ENV: development
      DB_PASSWORD_FILE: /run/secrets/pg_worker_password
      REDIS_PASSWORD_FILE: /run/secrets/redis_queue_password
    secrets:
      - pg_worker_password
      - redis_queue_password
    volumes: *workspace-volumes
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "const s = require('fs').statSync('/tmp/worker-heartbeat'); process.exit(Date.now() - s.mtimeMs < 30000 ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # Web app in development mode (ADR 0014): websites, family portal, staff workspaces.
  web:
    <<: *hardening
    image: pythagoras-dev:node24-pnpm12
    command: ["pnpm", "--filter", "@pythagoras/web", "dev"]
    depends_on:
      deps:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      <<: *workspace-env
      NODE_ENV: development
      # Reached through the gateway; the portal has one canonical address.
      APP_URL: http://portal.pythagoras.localhost:${GATEWAY_HOST_PORT:-53000}
      OIDC_CLIENT_SECRET_FILE: /run/secrets/keycloak_web_client_secret
      SESSION_SECRET_FILE: /run/secrets/web_session_secret
      NEXT_TELEMETRY_DISABLED: "1"
    secrets:
      - keycloak_web_client_secret
      - web_session_secret
    volumes: *workspace-volumes
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s

  # Front door (ADR 0015): routes each host name to its service.
  gateway:
    <<: *hardening
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    depends_on:
      web:
        condition: service_healthy
    environment:
      PORTAL_URL: http://portal.pythagoras.localhost:${GATEWAY_HOST_PORT:-53000}
    volumes:
      - ./infra/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /data
      - /config
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-53000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--header", "Host: api.pythagoras.localhost", "http://127.0.0.1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-off logical backup job. Run through scripts/db-backup.sh.
  db-backup:
    image: postgres:18.6-trixie@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    profiles: ["tools"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - pg_backup_password
    environment:
      DB_NAME: ${DB_NAME:-pythagoras}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - pg_backups:/backups
      - ./scripts/container/backup.sh:/opt/pythagoras/backup.sh:ro
    entrypoint: ["/bin/bash", "/opt/pythagoras/backup.sh"]

secrets:
  pg_superuser_password:
    file: ./secrets/pg_superuser_password
  pg_migrator_password:
    file: ./secrets/pg_migrator_password
  pg_api_password:
    file: ./secrets/pg_api_password
  pg_worker_password:
    file: ./secrets/pg_worker_password
  pg_reporting_password:
    file: ./secrets/pg_reporting_password
  pg_backup_password:
    file: ./secrets/pg_backup_password
  redis_queue_password:
    file: ./secrets/redis_queue_password
  redis_health_password:
    file: ./secrets/redis_health_password
  redis_admin_password:
    file: ./secrets/redis_admin_password
  pg_keycloak_password:
    file: ./secrets/pg_keycloak_password
  keycloak_admin_password:
    file: ./secrets/keycloak_admin_password
  keycloak_web_client_secret:
    file: ./secrets/keycloak_web_client_secret
  keycloak_dev_user_password:
    file: ./secrets/keycloak_dev_user_password
  web_session_secret:
    file: ./secrets/web_session_secret
  dev_payments_secret:
    file: ./secrets/dev_payments_secret

volumes:
  pg_data:
  pg_backups:
  redis_data:
  ws_node_modules:
  ws_api_node_modules:
  ws_api_dist:
  ws_web_node_modules:
  ws_web_next:
  ws_shared_node_modules:
  ws_shared_dist:
