# PostgreSQL 18 configuration for Pythagoras (development profile).
# Production overrides are listed in docs/operations.md; values marked [prod]
# must be revisited for the production host.

# --- Connections -------------------------------------------------------------
listen_addresses = '*'                 # container network only; host port is bound to 127.0.0.1
port = 5432
max_connections = 120                  # [prod] put PgBouncer in front before raising this
superuser_reserved_connections = 3
password_encryption = scram-sha-256
authentication_timeout = 10s
ssl = off                              # [prod] on, with certificates; pg_hba uses hostssl

# --- Memory (sized for a developer machine) -----------------------------------
shared_buffers = 512MB                 # [prod] ~25% of RAM
effective_cache_size = 1536MB          # [prod] ~50-75% of RAM
work_mem = 16MB
maintenance_work_mem = 128MB
huge_pages = try

# --- Write-ahead log and checkpoints -----------------------------------------
wal_level = replica                    # allows streaming replicas and point-in-time recovery
wal_compression = zstd
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
archive_mode = off                     # [prod] on, with pgBackRest or WAL-G archiving (see operations.md)
max_wal_senders = 5
wal_keep_size = 512MB

# --- Planner ------------------------------------------------------------------
random_page_cost = 1.1                 # SSD storage
effective_io_concurrency = 200
default_statistics_target = 100
jit = off                              # short OLTP queries; JIT adds latency

# --- Safety -------------------------------------------------------------------
default_toast_compression = lz4
idle_in_transaction_session_timeout = 5min   # per-role values are lower (see bootstrap)
lock_timeout = 0                       # set per role
statement_timeout = 0                  # set per role
transaction_timeout = 0                # set per role where useful

# --- Locale and time ----------------------------------------------------------
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C.UTF-8'
default_text_search_config = 'pg_catalog.simple'

# --- Logging ------------------------------------------------------------------
# Personal data must not reach server logs: parameter values are never logged.
log_destination = 'stderr'
logging_collector = off                # Docker collects stderr
log_line_prefix = '%m [%p] %q%u@%d app=%a '
log_connections = on
log_disconnections = on
log_min_duration_statement = 500ms
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_statement = 'ddl'
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 1s
log_checkpoints = on

# --- Statistics and extensions ------------------------------------------------
shared_preload_libraries = 'pg_stat_statements,auto_explain'
track_io_timing = on
track_functions = pl
compute_query_id = on
pg_stat_statements.max = 5000
pg_stat_statements.track = top
auto_explain.log_min_duration = '2s'
auto_explain.log_analyze = off
auto_explain.log_parameter_max_length = 0

# --- Autovacuum ---------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.05
