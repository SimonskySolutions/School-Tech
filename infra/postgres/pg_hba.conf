# Client authentication for Pythagoras (development profile).
# First matching line wins. [prod] replace "host" with "hostssl" for application roles.

# TYPE  DATABASE        USER                                                       ADDRESS   METHOD

# The superuser can only connect through the local socket inside the container.
local   all             postgres                                                             peer
host    all             postgres                                                   all       reject

# Application roles, password (SCRAM) only, from the Compose network and the host port.
host    pythagoras,pythagoras_test,pythagoras_restore_check pyth_migrator,pyth_api,pyth_worker,pyth_reporting,pyth_backup samenet scram-sha-256

# Keycloak reaches only its own database.
host    keycloak        pyth_keycloak                                              samenet   scram-sha-256
host    pythagoras_cms  pyth_cms                                                   samenet   scram-sha-256

# Everything else is refused.
local   all             all                                                                  reject
host    all             all                                                        all       reject
