# Client authentication for Pythagoras in production (M8.4, ADR 0033).
# First matching line wins. Only TLS from the network: every application role
# connects with "hostssl" and SCRAM, and anything without TLS is refused first.

# TYPE      DATABASE        USER                                                       ADDRESS   METHOD

# The superuser can only connect through the local socket inside the container.
local       all             postgres                                                             peer
host        all             postgres                                                   all       reject

# Nothing reaches the server unencrypted.
hostnossl   all             all                                                        all       reject

# The platform's roles (the API and worker through PgBouncer), on the data network only.
hostssl     pythagoras,pythagoras_restore_check pyth_migrator,pyth_api,pyth_worker,pyth_reporting,pyth_backup,pyth_monitor samenet scram-sha-256

# Keycloak and the CMS reach only their own databases.
hostssl     keycloak        pyth_keycloak                                              samenet   scram-sha-256
hostssl     pythagoras_cms  pyth_cms                                                   samenet   scram-sha-256

# Everything else is refused.
local       all             all                                                                  reject
host        all             all                                                        all       reject
