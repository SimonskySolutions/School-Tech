; Connection pooling for the API and the worker (M8.4, ADR 0033). Transaction
; pooling: a server connection is held for one transaction only, which the
; platform's request context allows (it is set with SET LOCAL / set_config(...,
; true) inside each transaction; no session state, advisory locks or LISTEN).
; TLS on both sides: clients must use it, and PostgreSQL's certificate is verified.

[databases]
pythagoras = host=postgres port=5432 dbname=pythagoras

[pgbouncer]
listen_addr = *
listen_port = 6432
unix_socket_dir =

auth_type = scram-sha-256
; Built from the secret files when the container starts (entrypoint.sh).
auth_file = /run/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 400
default_pool_size = 20
reserve_pool_size = 5
max_db_connections = 60
server_idle_timeout = 300
query_wait_timeout = 30
ignore_startup_parameters = extra_float_digits
; The exporter (M8.6) may read SHOW STATS, POOLS and the like, and change nothing.
stats_users = pyth_monitor

client_tls_sslmode = require
client_tls_protocols = tlsv1.3
client_tls_cert_file = /run/secrets/tls_pgbouncer_crt
client_tls_key_file = /run/secrets/tls_pgbouncer_key
; Without it PgBouncer looks for the system's store, which this image has not;
; clients still need no certificate of their own (sslmode = require).
client_tls_ca_file = /run/secrets/tls_ca_crt

server_tls_sslmode = verify-full
server_tls_protocols = tlsv1.3
server_tls_ca_file = /run/secrets/tls_ca_crt

logfile =
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
