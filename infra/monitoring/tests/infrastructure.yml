# Unit tests for ../rules/infrastructure.yml (M8.6): each alert fires on the
# condition it describes, and not before its time. Run by
# infra/monitoring/run.sh test, in CI through scripts/images-test.sh.
rule_files: [../rules/infrastructure.yml]
evaluation_interval: 1m
tests:
  # TargetDown
  - interval: 1m
    input_series:
      - series: 'up{job="redis", instance="redis-exporter:9121"}'
        values: '1 0 0 0 0'
    alert_rule_test:
      - eval_time: 2m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 3m
        alertname: TargetDown
        exp_alerts:
          - exp_labels: {"job": "redis", "instance": "redis-exporter:9121", "severity": "critical"}
            exp_annotations: {"description": "Prometheus has not reached redis-exporter:9121 for 2 minutes: the service or its exporter is down.", "summary": "redis cannot be scraped"}
  # ServiceUnhealthy
  - interval: 1m
    input_series:
      - series: 'probe_success{job="health", instance="blackbox:9115", target="http://api:3000/health/ready"}'
        values: '1 0 0 0 0'
    alert_rule_test:
      - eval_time: 2m
        alertname: ServiceUnhealthy
        exp_alerts: []
      - eval_time: 3m
        alertname: ServiceUnhealthy
        exp_alerts:
          - exp_labels: {"job": "health", "instance": "blackbox:9115", "target": "http://api:3000/health/ready", "severity": "critical"}
            exp_annotations: {"description": "The health check has failed for 2 minutes.", "summary": "http://api:3000/health/ready fails its health check"}
  # CertificateInvalid
  - interval: 1m
    input_series:
      - series: 'probe_success{job="certificate", instance="blackbox:9115", target="gateway:443"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 9m
        alertname: CertificateInvalid
        exp_alerts: []
      - eval_time: 11m
        alertname: CertificateInvalid
        exp_alerts:
          - exp_labels: {"job": "certificate", "instance": "blackbox:9115", "target": "gateway:443", "severity": "critical"}
            exp_annotations: {"description": "A TLS connection to the gateway with the portal's name has failed for 10 minutes: browsers will refuse the platform.", "summary": "The gateway's certificate cannot be verified"}
  # CertificateExpiresSoon
  - interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{job="certificate", instance="blackbox:9115", target="gateway:443"}'
        values: '864000x70'
    alert_rule_test:
      - eval_time: 30m
        alertname: CertificateExpiresSoon
        exp_alerts: []
      - eval_time: 61m
        alertname: CertificateExpiresSoon
        exp_alerts:
          - exp_labels: {"job": "certificate", "instance": "blackbox:9115", "target": "gateway:443", "severity": "warning"}
            exp_annotations: {"description": "Caddy renews certificates 30 days ahead; renewal is failing (see the gateway's log).", "summary": "The gateway's certificate expires in 9d 22h 59m 0s"}
  # HostDiskFilling
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="node-exporter:9100", job="node", device="/dev/sda1", fstype="ext4", mountpoint="/"}'
        values: '10x20'
      - series: 'node_filesystem_size_bytes{instance="node-exporter:9100", job="node", device="/dev/sda1", fstype="ext4", mountpoint="/"}'
        values: '100x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: HostDiskFilling
        exp_alerts: []
      - eval_time: 16m
        alertname: HostDiskFilling
        exp_alerts:
          - exp_labels: {"instance": "node-exporter:9100", "job": "node", "device": "/dev/sda1", "fstype": "ext4", "mountpoint": "/", "severity": "warning"}
            exp_annotations: {"description": "Less than 15 % of the disk is free.", "summary": "/ has 10% free"}
  # HostDiskFull
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="node-exporter:9100", job="node", device="/dev/sda1", fstype="ext4", mountpoint="/"}'
        values: '3x20'
      - series: 'node_filesystem_size_bytes{instance="node-exporter:9100", job="node", device="/dev/sda1", fstype="ext4", mountpoint="/"}'
        values: '100x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: HostDiskFull
        exp_alerts: []
      - eval_time: 6m
        alertname: HostDiskFull
        exp_alerts:
          - exp_labels: {"instance": "node-exporter:9100", "job": "node", "device": "/dev/sda1", "fstype": "ext4", "mountpoint": "/", "severity": "critical"}
            exp_annotations: {"description": "Less than 5 % of the disk is free: PostgreSQL stops when it cannot write its log.", "summary": "/ has 3% free"}
  # HostMemoryLow
  - interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{instance="node-exporter:9100", job="node"}'
        values: '5x20'
      - series: 'node_memory_MemTotal_bytes{instance="node-exporter:9100", job="node"}'
        values: '100x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: HostMemoryLow
        exp_alerts: []
      - eval_time: 11m
        alertname: HostMemoryLow
        exp_alerts:
          - exp_labels: {"instance": "node-exporter:9100", "job": "node", "severity": "warning"}
            exp_annotations: {"description": "Less than 10 % of the memory has been available for 10 minutes.", "summary": "5% of the memory is available"}
  # HostCpuBusy
  - interval: 1m
    input_series:
      - series: 'node_cpu_seconds_total{instance="node-exporter:9100", job="node", cpu="0", mode="idle"}'
        values: '0+3x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: HostCpuBusy
        exp_alerts: []
      - eval_time: 21m
        alertname: HostCpuBusy
        exp_alerts:
          - exp_labels: {"instance": "node-exporter:9100", "job": "node", "severity": "warning"}
            exp_annotations: {"description": "More than 90 % for 15 minutes.", "summary": "The processors are 95% busy"}
  # PostgresDown
  - interval: 1m
    input_series:
      - series: 'pg_up{instance="postgres-exporter:9187", job="postgres"}'
        values: '1 0 0 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: PostgresDown
        exp_alerts: []
      - eval_time: 3m
        alertname: PostgresDown
        exp_alerts:
          - exp_labels: {"instance": "postgres-exporter:9187", "job": "postgres", "severity": "critical"}
            exp_annotations: {"description": "The exporter has not reached PostgreSQL for a minute.", "summary": "PostgreSQL is not answering"}
  # PostgresConnectionsHigh
  - interval: 1m
    input_series:
      - series: 'pg_stat_activity_count{instance="postgres-exporter:9187", job="postgres", datname="pythagoras", state="active", usename="pyth_api", application_name="pgbouncer", backend_type="client backend"}'
        values: '50x10'
      - series: 'pg_stat_activity_count{instance="postgres-exporter:9187", job="postgres", datname="keycloak", state="idle", usename="pyth_keycloak", application_name="keycloak", backend_type="client backend"}'
        values: '50x10'
      - series: 'pg_settings_max_connections{instance="postgres-exporter:9187", job="postgres", server="postgres:5432"}'
        values: '120x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: PostgresConnectionsHigh
        exp_alerts: []
      - eval_time: 6m
        alertname: PostgresConnectionsHigh
        exp_alerts:
          - exp_labels: {"instance": "postgres-exporter:9187", "job": "postgres", "severity": "warning"}
            exp_annotations: {"description": "More than 80 % of max_connections for 5 minutes.", "summary": "PostgreSQL uses 83.33% of its connections"}
  # PostgresArchiveFailing
  - interval: 1m
    input_series:
      - series: 'pg_stat_archiver_failed_count{instance="postgres-exporter:9187", job="postgres", server="postgres:5432"}'
        values: '0+1x20'
      - series: 'pg_stat_archiver_last_archive_age{instance="postgres-exporter:9187", job="postgres", server="postgres:5432"}'
        values: '400+60x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: PostgresArchiveFailing
        exp_alerts: []
      - eval_time: 16m
        alertname: PostgresArchiveFailing
        exp_alerts:
          - exp_labels: {"instance": "postgres-exporter:9187", "job": "postgres", "server": "postgres:5432", "severity": "critical"}
            exp_annotations: {"description": "Archiving has failed and nothing was archived for 22m 40s: data written since is not backed up, and pg_wal grows. Check the backup service and the off-site storage.", "summary": "The write-ahead log is not reaching the backups"}
  # PostgresLongTransaction
  - interval: 1m
    input_series:
      - series: 'pg_stat_activity_max_tx_duration{instance="postgres-exporter:9187", job="postgres", datname="pythagoras", state="idle in transaction", usename="pyth_api", application_name="pgbouncer", server="postgres:5432"}'
        values: '700x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: PostgresLongTransaction
        exp_alerts: []
      - eval_time: 6m
        alertname: PostgresLongTransaction
        exp_alerts:
          - exp_labels: {"instance": "postgres-exporter:9187", "job": "postgres", "server": "postgres:5432", "severity": "warning"}
            exp_annotations: {"description": "Long transactions hold back vacuum and locks.", "summary": "A transaction has been open for 11m 40s"}
  # PgBouncerDown
  - interval: 1m
    input_series:
      - series: 'pgbouncer_up{instance="pgbouncer-exporter:9127", job="pgbouncer"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 0m
        alertname: PgBouncerDown
        exp_alerts: []
      - eval_time: 2m
        alertname: PgBouncerDown
        exp_alerts:
          - exp_labels: {"instance": "pgbouncer-exporter:9127", "job": "pgbouncer", "severity": "critical"}
            exp_annotations: {"description": "The API and the worker reach PostgreSQL only through PgBouncer.", "summary": "PgBouncer is not answering"}
  # PgBouncerClientsWaiting
  - interval: 1m
    input_series:
      - series: 'pgbouncer_pools_client_waiting_connections{instance="pgbouncer-exporter:9127", job="pgbouncer", database="pythagoras", user="pyth_api"}'
        values: '3x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: PgBouncerClientsWaiting
        exp_alerts: []
      - eval_time: 3m
        alertname: PgBouncerClientsWaiting
        exp_alerts:
          - exp_labels: {"instance": "pgbouncer-exporter:9127", "job": "pgbouncer", "severity": "warning"}
            exp_annotations: {"description": "Every pooled connection has been busy for 2 minutes.", "summary": "Clients are waiting for a database connection"}
  # RedisDown
  - interval: 1m
    input_series:
      - series: 'redis_up{instance="redis-exporter:9121", job="redis"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 0m
        alertname: RedisDown
        exp_alerts: []
      - eval_time: 2m
        alertname: RedisDown
        exp_alerts:
          - exp_labels: {"instance": "redis-exporter:9121", "job": "redis", "severity": "critical"}
            exp_annotations: {"description": "The queues stop; events wait in PostgreSQL's outbox and are relayed when Redis returns.", "summary": "Redis is not answering"}
  # RedisMemoryHigh
  - interval: 1m
    input_series:
      - series: 'redis_memory_max_bytes{instance="redis-exporter:9121", job="redis"}'
        values: '100x15'
      - series: 'redis_memory_used_bytes{instance="redis-exporter:9121", job="redis"}'
        values: '95x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: RedisMemoryHigh
        exp_alerts: []
      - eval_time: 11m
        alertname: RedisMemoryHigh
        exp_alerts:
          - exp_labels: {"instance": "redis-exporter:9121", "job": "redis", "severity": "warning"}
            exp_annotations: {"description": "More than 90 % of maxmemory for 10 minutes.", "summary": "Redis uses 95% of its memory"}
  # AlertDeliveryFailing
  - interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{instance="alertmanager:9093", job="alertmanager", integration="email", reason="other"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: AlertDeliveryFailing
        exp_alerts: []
      - eval_time: 21m
        alertname: AlertDeliveryFailing
        exp_alerts:
          - exp_labels: {"instance": "alertmanager:9093", "job": "alertmanager", "integration": "email", "reason": "other", "severity": "critical"}
            exp_annotations: {"description": "Alertmanager cannot deliver to email: check the SMTP service and the smtp_password secret.", "summary": "Alert e-mails are not being sent"}
  # RuleEvaluationFailing
  - interval: 1m
    input_series:
      - series: 'prometheus_rule_evaluation_failures_total{instance="localhost:9090", job="prometheus", rule_group="/etc/pythagoras-monitoring/rules/platform.yml;platform"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: RuleEvaluationFailing
        exp_alerts: []
      - eval_time: 21m
        alertname: RuleEvaluationFailing
        exp_alerts:
          - exp_labels: {"instance": "localhost:9090", "job": "prometheus", "rule_group": "/etc/pythagoras-monitoring/rules/platform.yml;platform", "severity": "warning"}
            exp_annotations: {"description": "Rule group /etc/pythagoras-monitoring/rules/platform.yml;platform has failed for 10 minutes.", "summary": "Alert rules fail to evaluate"}
