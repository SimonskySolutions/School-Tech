# Alertmanager for the production stack (M8.6, ADR 0036): every alert by
# e-mail through the platform's SMTP service, over TLS. run.sh fills in the
# __NAMES__; the password is the smtp_password secret.
global:
  smtp_smarthost: "__SMTP_HOST__:__SMTP_PORT__"
  smtp_from: "__MAIL_FROM__"
  smtp_auth_username: "__SMTP_USER__"
  smtp_auth_password_file: /run/secrets/smtp_password
  smtp_require_tls: true

route:
  receiver: email
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  # Critical alerts are repeated every 4 hours while they last, warnings daily.
  repeat_interval: 4h
  routes:
    - matchers: [severity = "warning"]
      receiver: email
      repeat_interval: 24h

# While a service is down, the alerts that only follow from it stay quiet.
inhibit_rules:
  - source_matchers: [alertname = "PostgresDown"]
    target_matchers: [severity =~ "warning|critical", alertname =~ "PgBouncer.*|Outbox.*|Messages.*|Webhooks.*"]
  - source_matchers: [alertname = "RedisDown"]
    target_matchers: [alertname =~ "Queue.*|Outbox.*"]

receivers:
  - name: email
    email_configs:
      - to: "__ALERT_EMAIL_TO__"
        send_resolved: true
