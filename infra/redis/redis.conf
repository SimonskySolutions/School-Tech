# Redis 8.10 configuration for Pythagoras: BullMQ queue store (development profile).
# Redis holds no personal data: job payloads carry identifiers only (ADR 0002, 0006).

# --- Network ------------------------------------------------------------------
# Redis does not allow comments after a value, so notes go on their own lines.
# Listens on the container network only; the host port is bound to 127.0.0.1.
bind * -::*
protected-mode yes
port 6379
tcp-backlog 511
tcp-keepalive 300
timeout 0
maxclients 1000
# [prod] TLS: tls-port 6380, port 0, tls-cert-file/tls-key-file/tls-ca-cert-file

# --- Access control -----------------------------------------------------------
# Users and password hashes are generated at start-up from Docker secrets.
aclfile /run/redis-acl/users.acl
acllog-max-len 256

# --- Memory -------------------------------------------------------------------
# BullMQ requires noeviction: an evicted queue key is a lost job.
maxmemory 512mb
maxmemory-policy noeviction
lazyfree-lazy-user-del yes
lazyfree-lazy-expire yes

# --- Persistence --------------------------------------------------------------
dir /data
appendonly yes
appenddirname "appendonlydir"
appendfilename "appendonly.aof"
appendfsync everysec
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
save 3600 1 300 100 60 10000
dbfilename dump.rdb
rdbcompression yes
rdbchecksum yes
stop-writes-on-bgsave-error yes
databases 1

# --- Hardening ----------------------------------------------------------------
enable-protected-configs no
enable-debug-command no
enable-module-command no

# --- Observability ------------------------------------------------------------
loglevel notice
logfile ""
slowlog-log-slower-than 10000
slowlog-max-len 256
latency-monitor-threshold 100
