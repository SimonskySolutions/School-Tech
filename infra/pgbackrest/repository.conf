# pgBackRest on the backup service (M8.5, ADR 0035): the repository host. It
# receives the database's write-ahead log over TLS, reads the data directory
# (mounted read-only) for backups and writes everything, encrypted, to the
# off-site S3-compatible storage. The storage's address and key come from the
# environment and the secrets (pythagoras-backup sets them).
[global]
repo1-type=s3
repo1-path=/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-bundle=y
repo1-block=y
# Four weekly full backups, each with its daily differentials and the log in
# between: restores to any moment of the last four to five weeks.
repo1-retention-full-type=count
repo1-retention-full=4
compress-type=zst
process-max=2
start-fast=y
lock-path=/tmp/pgbackrest/lock
log-level-console=info
log-level-file=off

# The server the database pushes its log to; only the database's certificate
# (CN "postgres") may use it, and only for this stanza.
tls-server-address=*
tls-server-ca-file=/run/secrets/tls_ca_crt
tls-server-cert-file=/tmp/pgbackrest/tls/server.crt
tls-server-key-file=/tmp/pgbackrest/tls/server.key
tls-server-auth=postgres=pythagoras

[pythagoras]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
