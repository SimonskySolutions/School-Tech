# pgBackRest on the database's side (M8.5, ADR 0035). PostgreSQL's
# archive_command pushes each write-ahead log segment to the backup service
# over pgBackRest's TLS protocol, presenting the database's certificate. The
# repository, its credentials and the encryption key are only on that side.
[global]
repo1-host=backup
repo1-host-type=tls
repo1-host-ca-file=/run/secrets/tls_ca_crt
repo1-host-cert-file=/run/postgresql-tls/server.crt
repo1-host-key-file=/run/postgresql-tls/server.key
compress-type=zst
log-level-console=warn
log-level-file=off

[pythagoras]
pg1-path=/var/lib/postgresql/18/docker
