# The Pythagoras look for the sign-in pages (docs/design.md): Keycloak's own
# login theme with the portal's colours, logo and shapes on top. Only styles
# change, so every form field keeps the ids the platform's tests use.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/pythagoras.css
# One light design, like the portal.
darkMode=false
